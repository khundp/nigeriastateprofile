<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nigeria State Profiles · UNDP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #0072bc;
      --brand-dark: #005a8a;
      --bg: #f9f9f9;
      --text: #333;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 12px 16px;
      border-bottom: 2px solid var(--brand);
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }
    .header-left h1 {
      margin: 0;
      font-size: 2em;
      color: var(--brand);
    }
    .logo { height: 120px; width: auto; }
    .subtext { margin-top: 10px; font-size: 1.1em; color: #555; }

    /* Main */
    main {
      flex: 1;
      width: 100%;
      margin: 0;
      padding: 8px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      background: #fff;
    }

    /* Grid */
    #stateGrid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    @media (max-width: 900px) {
      #stateGrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    }
    @media (max-width: 640px) {
      #stateGrid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    }

    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #eee;
      aspect-ratio: 4/3;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }
    .card:hover {
      box-shadow: 0 14px 28px rgba(0,0,0,0.18);
      transform: translateY(-2px);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .card:hover img {
      transform: scale(1.06);
    }

    /* Title block */
    .titlebar {
      position: absolute;
      top: 10px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 3;
    }
    .titlebar .name {
      background: rgba(0,0,0,.6);
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: .95rem;
      backdrop-filter: blur(2px);
    }
    .titlebar .zone {
      text-transform: capitalize;
      background: rgba(0,0,0,.45);
      color: #fff;
      border-radius: 8px;
      opacity: 0;
      visibility: hidden;
      max-height: 0;
      padding: 0 8px;
      margin-top: 0;
      transform: translateY(-4px);
      transition: .2s;
    }
    .card:hover .titlebar .zone {
      opacity: 1;
      visibility: visible;
      max-height: 24px;
      padding: 4px 8px;
      margin-top: 4px;
      transform: translateY(0);
    }

    /* Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55));
      opacity: 0;
      transition: opacity 0.25s ease;
      color: #fff;
      pointer-events: none;
    }
    .card:hover .overlay { opacity: 1; }

    .overlay .desc { font-size: 0.9rem; max-width: 90ch; }
    .overlay a {
      align-self: flex-start;
      background: var(--brand);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      pointer-events: auto;
    }
    .overlay a:hover { background: var(--brand-dark); }


/* --- UNDP OFFICIAL BLUE FOOTER WITH FULL TEXT --- */
.undp-footer {
  background: #0067b9; /* Official UNDP Blue */
  padding: 55px 20px;
  margin-top: 60px;
  color: #ffffff;
}

.undp-footer-content {
  display: flex;
  align-items: center;
  gap: 26px;
  margin-left: 40px; /* shifts content to left, like your reference footer */
}

.undp-footer-logo {
  width: 140px;   /* Larger professional size */
  height: auto;
}

.undp-footer-text {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.35;
  color: #ffffff;
}

.undp-footer-text .undp-subtext {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 1.05rem;
  margin-top: 10px;
  display: inline-block;
  opacity: 0.95;
}




  </style>
</head>

<body>
  <header>
    <div class="header-left">
      <img src="undp_logo.png" alt="UNDP Logo" class="logo" />
      <div>
        <h1>Nigeria State Profiles</h1>
        <p class="subtext">Your gateway to detailed state information and overview</p>
      </div>
    </div>
  </header>

  <main>
    <div class="filters">
      <input type="search" id="search" placeholder="Search states...">
      <select id="zone">
        <option value="all">All Zones</option>
        <option value="south-east">South East</option>
        <option value="south-south">South South</option>
        <option value="south-west">South West</option>
        <option value="north-central">North Central</option>
        <option value="north-east">North East</option>
        <option value="north-west">North West</option>
      </select>
    </div>

    <div id="stateGrid"></div>
  </main>

<footer class="undp-footer">
  <div class="undp-footer-content">
    <img src="UNDP_logo_White.png" alt="UNDP Logo" class="undp-footer-logo">

    <div class="undp-footer-text">
      United Nations<br>
      Development Programme<br>
      Nigeria<br>
      <span class="undp-subtext">Knowledge Hub</span>
    </div>
  </div>
</footer>


    



  <script>
    const states = [
      ["Abia","south-east"], ["Adamawa","north-east"], ["Akwa Ibom","south-south"], ["Anambra","south-east"],
      ["Bauchi","north-east"], ["Bayelsa","south-south"], ["Benue","north-central"], ["Borno","north-east"],
      ["Cross River","south-south"], ["Delta","south-south"], ["Ebonyi","south-east"], ["Edo","south-south"],
      ["Ekiti","south-west"], ["Enugu","south-east"], ["FCT","north-central"], ["Gombe","north-east"],
      ["Imo","south-east"], ["Jigawa","north-west"], ["Kaduna","north-west"], ["Kano","north-west"],
      ["Katsina","north-west"], ["Kebbi","north-west"], ["Kogi","north-central"], ["Kwara","north-central"],
      ["Lagos","south-west"], ["Nasarawa","north-central"], ["Niger","north-central"], ["Ogun","south-west"],
      ["Ondo","south-west"], ["Osun","south-west"], ["Oyo","south-west"], ["Plateau","north-central"],
      ["Rivers","south-south"], ["Sokoto","north-west"], ["Taraba","north-east"], ["Yobe","north-east"], ["Zamfara","north-west"]
    ];



    
    // const activeStates = ["Abia"];                                               // only Abia is active for now



    
    const DESC = {
      abia:"Home of Enterprise and Innovation",
      adamawa:"Land of Beauty, Hills, and Harmony",
      akwaibom:"Nigeria’s Rising Coastal Power",
      anambra:"Where Commerce Meets Ingenuity",
      bauchi:"Gateway to Adventure and Nature",
      bayelsa:"Heart of Nigeria’s Blue Economy",
      benue:"Proudly the Nation’s Food Basket",
      borno:"Resilience, Heritage, and Hope",
      crossriver:"Africa’s Green Paradise",
      delta:"Energy, Diversity, and Progress",
      ebonyi:"The Salt of the Nation",
      edo:"Cradle of Culture and Creativity",
      ekiti:"Land of Honor and Learning",
      enugu:"Coal City of Opportunities",
      fct:"The Nation’s Capital of Unity",
      gombe:"Jewel of the Savannah",
      imo:"Heartland of Industry and Talent",
      jigawa:"Growing with Purpose",
      kaduna:"Center of Learning and Enterprise",
      kano:"Commerce Capital of the North",
      katsina:"Strength in Agriculture and Tradition",
      kebbi:"Land of Rice and Rich Heritage",
      kogi:"Confluence of Opportunities",
      kwara:"State of Harmony and Ideas",
      lagos:"Where Nigeria Thrives",
      nasarawa:"Home of Minerals and New Horizons",
      niger:"Powering Agriculture and Energy",
      ogun:"Industrial Heart of the Southwest",
      ondo:"Cocoa, Coastlines, and Growth",
      osun:"Soul of Yoruba Culture",
      oyo:"Land of Knowledge and Heritage",
      plateau:"Home of Peace and Cool Beauty",
      rivers:"Energy Hub of the Nation",
      sokoto:"Seat of the Caliphate, Center of Wisdom",
      taraba:"Nature’s Gift to Nigeria",
      yobe:"Emerging Strength of the Sahel",
      zamfara:"Land of Gold and Promise"
    };

    function slugify(n) {
      return n.toLowerCase().replace(/\s+/g, '');
    }

    function getDesc(name, z) {
      const key = slugify(name);
      return DESC[key] || `${name} — key indicators, economy & people. Zone: ${z.replace('-', ' ')}`;
    }

    const grid = document.getElementById('stateGrid');
    const search = document.getElementById('search');
    const zone = document.getElementById('zone');

    function render() {
      const query = search.value.toLowerCase();
      const zoneVal = zone.value;
      grid.innerHTML = '';

      states


             
                                                .filter(([name, z]) => (zoneVal === 'all' || z === zoneVal) && name.toLowerCase().includes(query))                 // reactivate later by removing this and the block bottom and active this line .



        

      


        
        .forEach(([name, z]) => {
          const slug = slugify(name);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="images/${slug}.jpg" alt="${name}" loading="lazy">
            <div class="titlebar">
              <span class="name">${name}</span>
              <span class="zone">${z.replace('-', ' ')}</span>
            </div>
            <div class="overlay">
              <div class="desc">${getDesc(name, z)}</div>
              <a href="viewer.html?state=${slug}">View Profile</a>
            </div>
          `;
          grid.appendChild(card);
        });
    }

    search.addEventListener('input', render);
    zone.addEventListener('change', render);

    render();
  </script>

</body>
</html>
