<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nigeria State Profiles · UNDP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #0072bc;
      --brand-dark: #005a8a;
      --bg: #f9f9f9;
      --text: #333;
      --radius: 14px;
    }
    * {box-sizing: border-box;}
    html, body {height: 100%;}
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Header (like original) */
    header {
      padding: 12px 16px;
      border-bottom: 2px solid var(--brand);
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }
    .header-left h1 {
      margin: 0;
      font-size: 2em;
      color: var(--brand);
    }
    .logo {
      height: 120px;
      width: auto;
    }
    .subtext {
      margin-top: 10px;
      font-size: 1.1em;
      color: #555;
    }

    /* Main */
    main {
      flex: 1;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .filters input, .filters select {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }

    /* Grid */
    .grid {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    @media (max-width: 640px){
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
    @media (min-width: 1024px){
      .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    }
    /* Flex fallback for older browsers */
    @supports not (display: grid) {
      .grid { display: flex; flex-wrap: wrap; gap: 18px; }
      .grid .card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: #ddd;
      aspect-ratio: 4 / 3; /* responsive shape */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    @supports not (aspect-ratio: 4 / 3) {
      .card { height: 180px; }
    }
      @media (min-width: 768px){ .grid .card { width: calc(33.333% - 12px); } }
      @media (min-width: 1100px){ .grid .card { width: calc(25% - 13.5px); } }
    }

    .card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: #ddd;
      aspect-ratio: 4 / 3; /* responsive, keeps cards side-by-side */
      min-height: 150px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      -webkit-user-drag: none; /* ensure consistent rendering */
    }
    .card:hover img {
      transform: scale(1.1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.6));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card:hover .overlay {opacity: 1;}

    .overlay h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .overlay p {
      margin: 2px 0 8px;
      font-size: 0.9rem;
      opacity: 0.85;
    }
    .overlay a {
      background: var(--brand);
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: inline-block;
      transition: background 0.2s ease;
    }
    .overlay a:hover {background: var(--brand-dark);}

    footer {
      background: var(--brand);
      color: white;
      text-align: center;
      padding: 40px 16px 30px;
      margin-top: 40px;
    }
    footer img {height: 100px;}
  @media (min-width: 768px) {
    .grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  }
  /* --- Force multi‑column grid overrides --- */
  #stateGrid { display: grid !important; gap: 18px !important; grid-auto-rows: 1fr; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) !important; }
  @media (max-width: 640px){ #stateGrid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important; } }
  @media (min-width: 1024px){ #stateGrid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) !important; } }
  #stateGrid > .card { width: auto !important; }
  .card { aspect-ratio: 4 / 3; }
  * { min-width: 0; }
  /* --- Hard column layout to fix vertical stacking --- */
  #stateGrid { display: grid !important; gap: 18px !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  @media (min-width: 640px){ #stateGrid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; } }
  @media (min-width: 900px){ #stateGrid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; } }
  @media (min-width: 1280px){ #stateGrid { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; } }
  #stateGrid .card { grid-column: auto !important; width: auto !important; }
  /* Slightly shorter cards so rows feel lighter on small screens */
  .card { aspect-ratio: 3 / 2; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="undp_logo.png" alt="UNDP Logo" class="logo" />
      <div>
        <h1>Nigeria State Profiles</h1>
        <p class="subtext">Your gateway to detailed state information and overview</p>
      </div>
    </div>
  </header>

  <main>
    <div class="filters">
      <input type="search" id="search" placeholder="Search states...">
      <select id="zone">
        <option value="all">All Zones</option>
        <option value="south-east">South East</option>
        <option value="south-south">South South</option>
        <option value="south-west">South West</option>
        <option value="north-central">North Central</option>
        <option value="north-east">North East</option>
        <option value="north-west">North West</option>
      </select>
    </div>

    <div class="grid" id="stateGrid"></div>
  </main>

  <footer>
    <img src="UNDP_logo_White.png" alt="UNDP Logo" />
    <p>© 2025 United Nations Development Programme Nigeria Knowledge Hub</p>
  </footer>

  <script>
    const states = [
      ["Abia","south-east"], ["Adamawa","north-east"], ["Akwa Ibom","south-south"], ["Anambra","south-east"],
      ["Bauchi","north-east"], ["Bayelsa","south-south"], ["Benue","north-central"], ["Borno","north-east"],
      ["Cross River","south-south"], ["Delta","south-south"], ["Ebonyi","south-east"], ["Edo","south-south"],
      ["Ekiti","south-west"], ["Enugu","south-east"], ["FCT","north-central"], ["Gombe","north-east"],
      ["Imo","south-east"], ["Jigawa","north-west"], ["Kaduna","north-west"], ["Kano","north-west"],
      ["Katsina","north-west"], ["Kebbi","north-west"], ["Kogi","north-central"], ["Kwara","north-central"],
      ["Lagos","south-west"], ["Nasarawa","north-central"], ["Niger","north-central"], ["Ogun","south-west"],
      ["Ondo","south-west"], ["Osun","south-west"], ["Oyo","south-west"], ["Plateau","north-central"],
      ["Rivers","south-south"], ["Sokoto","north-west"], ["Taraba","north-east"], ["Yobe","north-east"], ["Zamfara","north-west"]
    ];

    const grid = document.getElementById('stateGrid');
    const search = document.getElementById('search');
    const zone = document.getElementById('zone');

    function render() {
      const query = search.value.toLowerCase();
      const zoneVal = zone.value;
      grid.innerHTML = '';
      states
        .filter(([name, z]) => (zoneVal === 'all' || z === zoneVal) && name.toLowerCase().includes(query))
        .forEach(([name, z]) => {
          const slug = name.toLowerCase().replace(/\s+/g, '');
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="images/${slug}.jpg" alt="${name}">
            <div class="overlay">
              <h3>${name}</h3>
              <p>${z.replace('-', ' ')}</p>
              <a href="viewer.html?state=${slug}">View Profile</a>
            </div>`;
          grid.appendChild(card);
        });
    }

    search.addEventListener('input', render);
    zone.addEventListener('change', render);
    render();
  </script>
</body>
</html>
