<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nigeria State Profiles · UNDP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #0072bc;
      --brand-dark: #005a8a;
      --bg: #f9f9f9;
      --text: #333;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Header (like original) */
    header {
      padding: 12px 16px;
     
      border-bottom: 2px solid var(--brand);
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }
    .header-left h1 {
      margin: 0;
      font-size: 2em;
      color: var(--brand);
    }
    .logo { height: 120px; width: auto; }
    .subtext { margin-top: 10px; font-size: 1.1em; color: #555; }

    /* Main content width: keep readable and avoids over-large cards */
main {
  flex: 1;
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 8px;
}




    .filters {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
       margin-top: 24px; /* adds top space below header */
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      background: #fff;
    }

    /* Grid: 1/2/3/4 columns responsive; fixed 4 columns on desktop */
#stateGrid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  margin: 0;
}
@media (max-width: 900px) {
  #stateGrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
}
@media (max-width: 640px) {
  #stateGrid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}


    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;         /* clip zooming image */
      cursor: pointer;
      background: #eee;
      aspect-ratio: 4 / 3;      /* consistent visual size; not too tall/wide */
      transition: box-shadow 0.25s ease, transform 0.25s ease;
      isolation: isolate;
    }
    .card:hover { box-shadow: 0 14px 28px rgba(0,0,0,0.18); transform: translateY(-2px); }

    .card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.45s ease; transform: translateZ(0);
    }
    .card:hover img { transform: scale(1.06); }

    /* Always-visible name at top-left */
/* Title block */
.titlebar{
  position:absolute; top:10px; left:12px; z-index:3;
  display:flex; flex-direction:column; align-items:flex-start; gap:0;
}

/* State name (always visible) */
.titlebar .name{
  background:rgba(0,0,0,.6); color:#fff; padding:6px 10px;
  border-radius:10px; font-size:.95rem; backdrop-filter:blur(2px);
}

/* Zone: hidden by default (takes no space) */
.titlebar .zone{
  background:rgba(0,0,0,.45); color:#fff; border-radius:8px;
  /* start hidden */
  opacity:0; visibility:hidden; max-height:0; overflow:hidden;
  padding:0 8px; margin-top:0; transform:translateY(-4px);
  transition: opacity .2s ease, transform .2s ease,
              max-height .2s ease, padding .2s ease, margin-top .2s ease,
              visibility 0s linear .2s; /* delay visibility to match fade out */
}

/* Show zone only on hover */
.card:hover .titlebar .zone{
  opacity:1; visibility:visible; max-height:24px;
  padding:4px 8px; margin-top:4px; transform:translateY(0);
  transition: opacity .2s ease, transform .2s ease,
              max-height .2s ease, padding .2s ease, margin-top .2s ease,
              visibility 0s; /* visible immediately on hover */
}



    /* Hover overlay shows zone + description + button */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 12px; gap: 10px; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55));
      opacity: 0; transition: opacity 0.25s ease; color: #fff;
    }
    .card:hover .overlay { opacity: 1; }
    .overlay .zone { font-size: 0.92rem; opacity: 0.95; }
    .overlay .desc { font-size: 0.9rem; opacity: 0.95; max-width: 90ch; }
    .overlay a {
      pointer-events: auto;
      align-self: flex-start;
      background: var(--brand); color: #fff; text-decoration: none;
      padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .overlay a:hover { background: var(--brand-dark); }

    footer {
      background: var(--brand);
      color: white;
      text-align: center;
      padding: 40px 16px 30px;
      margin-top: 40px;
    }
    footer img { height: 100px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="undp_logo.png" alt="UNDP Logo" class="logo" />
      <div>
        <h1>Nigeria State Profiles</h1>
        <p class="subtext">Your gateway to detailed state information and overview</p>
      </div>
    </div>
  </header>

  <main>
    <div class="filters">
      <input type="search" id="search" placeholder="Search states...">
      <select id="zone">
        <option value="all">All Zones</option>
        <option value="south-east">South East</option>
        <option value="south-south">South South</option>
        <option value="south-west">South West</option>
        <option value="north-central">North Central</option>
        <option value="north-east">North East</option>
        <option value="north-west">North West</option>
      </select>
    </div>

    <div id="stateGrid"></div>
  </main>

  <footer>
    <img src="UNDP_logo_White.png" alt="UNDP Logo" />
    <p>© 2025 United Nations Development Programme Nigeria Knowledge Hub</p>
  </footer>

  <script>
    // --- State data ---
    const states = [
      ["Abia","south-east"], ["Adamawa","north-east"], ["Akwa Ibom","south-south"], ["Anambra","south-east"],
      ["Bauchi","north-east"], ["Bayelsa","south-south"], ["Benue","north-central"], ["Borno","north-east"],
      ["Cross River","south-south"], ["Delta","south-south"], ["Ebonyi","south-east"], ["Edo","south-south"],
      ["Ekiti","south-west"], ["Enugu","south-east"], ["FCT","north-central"], ["Gombe","north-east"],
      ["Imo","south-east"], ["Jigawa","north-west"], ["Kaduna","north-west"], ["Kano","north-west"],
      ["Katsina","north-west"], ["Kebbi","north-west"], ["Kogi","north-central"], ["Kwara","north-central"],
      ["Lagos","south-west"], ["Nasarawa","north-central"], ["Niger","north-central"], ["Ogun","south-west"],
      ["Ondo","south-west"], ["Osun","south-west"], ["Oyo","south-west"], ["Plateau","north-central"],
      ["Rivers","south-south"], ["Sokoto","north-west"], ["Taraba","north-east"], ["Yobe","north-east"], ["Zamfara","north-west"]
    ];

    // --- Descriptions map (slug -> short text) ---
    const DESC = {
      abia: "Known for thriving commerce and small industries in Aba, a major manufacturing hub in southeastern Nigeria.",
      adamawa: "Mountainous and agricultural, with Yola as a center for trade, learning, and cross-border commerce.",
      akwaibom: "A leading oil-producing state with clean cities, growing tourism, and the Ibom Deep Seaport project.",
      anambra: "Dynamic trade and education hub; Onitsha hosts one of West Africa’s largest markets.",
      bauchi: "Home to Yankari Game Reserve; agriculture and light manufacturing are growing sectors.",
      bayelsa: "Coastal Niger Delta state rich in oil and gas, investing in energy, skills, and education.",
      benue: "Nigeria’s food basket with diverse crop production and a large farming population.",
      borno: "Historically significant Sahel trade center working toward recovery and resilient livelihoods.",
      crossriver: "Eco-tourism and biodiversity hotspot; Calabar is known for culture and festivals.",
      delta: "Diverse, oil-rich economy with expanding agriculture and industry beyond petroleum.",
      ebonyi: "Agriculture and salt deposits underpin a fast-growing state capital, Abakaliki.",
      edo: "Renowned for cultural heritage and learning; Benin City anchors commerce and governance.",
      ekiti: "Strong educational base and agriculture, set among scenic hills and landscapes.",
      enugu: "Former coal-mining center turned regional hub for education, business, and services.",
      fct: "Nigeria’s capital territory—planned city of Abuja, focused on governance, diplomacy, and urban development.",
      gombe: "Peaceful, agriculturally vibrant state increasingly noted for governance reforms.",
      imo: "Industrial and educational strengths centered around Owerri with an active private sector.",
      jigawa: "Agriculture-led growth with reforms in education and rural infrastructure.",
      kaduna: "Key northern center for industry, education, and public administration.",
      kano: "Commercial heartbeat of northern Nigeria with deep cultural and trading roots.",
      katsina: "Predominantly agricultural with expanding infrastructure and education investments.",
      kebbi: "Leading rice producer; Argungu Fishing Festival highlights rich cultural heritage.",
      kogi: "Centrally located, mineral-rich; Lokoja links major transport corridors.",
      kwara: "Peaceful, diverse state bridging north and south with strong education assets.",
      lagos: "Nigeria’s commercial engine—finance, technology, culture, and ports drive rapid growth.",
      nasarawa: "Rich in solid minerals with rising agricultural investments near the FCT.",
      niger: "Nigeria’s largest state by land area, known for hydroelectric power and agriculture.",
      ogun: "Industrial powerhouse near Lagos attracting manufacturing and construction.",
      ondo: "Major cocoa producer with growing oil and gas development.",
      osun: "Cultural heartbeat with Yoruba heritage sites, including Osun-Osogbo Sacred Grove.",
      oyo: "Ibadan anchors education, research, and media across southwestern Nigeria.",
      plateau: "Temperate climate, tourism, and mining; Jos is a multicultural urban center.",
      rivers: "Energy capital centered on Port Harcourt—oil, gas, and logistics hub.",
      sokoto: "Historic seat of the Caliphate and a center of Islamic scholarship and trade.",
      taraba: "Scenic, resource-rich state with tea, cocoa, and significant livestock.",
      yobe: "A key livestock and crop producer with emerging renewable energy potential.",
      zamfara: "Mineral-rich and agricultural with opportunities in solid minerals and trade."
    };

    function slugify(n){ return n.toLowerCase().replace(/\s+/g, ''); }
    function getDesc(name, z){
      const key = slugify(name);
      return DESC[key] || `${name} — key indicators, economy & people. Zone: ${z.replace('-', ' ')}`;
    }

    const grid = document.getElementById('stateGrid');
    const search = document.getElementById('search');
    const zone = document.getElementById('zone');

    function render() {
      const query = search.value.toLowerCase();
      const zoneVal = zone.value;
      grid.innerHTML = '';
      states
        .filter(([name, z]) => (zoneVal === 'all' || z === zoneVal) && name.toLowerCase().includes(query))
        .forEach(([name, z]) => {
          const slug = slugify(name);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="images/${slug}.jpg" alt="${name}" loading="lazy">
            
<div class="titlebar">
  <span class="name">${name}</span>
  <span class="zone">${z.replace('-', ' ')}</span>
</div>
<div class="overlay">
  <div class="desc">${getDesc(name, z)}</div>
  <a href="viewer.html?state=${slug}">View Profile</a>
</div>
`;
          grid.appendChild(card);
        });
    }

    search.addEventListener('input', render);
    zone.addEventListener('change', render);
    render();
  </script>
</body>
</html>
